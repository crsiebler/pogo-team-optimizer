[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pogo-team-optimizer"
version = "0.1.0"
description = "Pokemon GO PvP team analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.4",
]

[project.scripts]
pogo-team-optimizer = "pogo_team_optimizer.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pogo_team_optimizer*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["^tests/"]
